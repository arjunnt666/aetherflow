name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings pyyaml httpx pytest pytest-asyncio typer rich
      - name: unit
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: calc smoke
        env:
          PYTHONPATH: src
        run: python -m aetherflow.cli.main calc "2+2*3"
