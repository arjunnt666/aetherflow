name: automated_code_review
version: "1.3.0"

triggers:
  - event: "github.pull_request.opened"
  - event: "github.pull_request.synchronize"

stages:
  - name: fetch_diff
    agent: executor
    tools: []
    output: diff
  - name: review
    agent: coder
    depends_on: [fetch_diff]
    output: review_comments
  - name: security_scan
    agent: critic
    depends_on: [fetch_diff]
    output: security_findings
  - name: summarize
    agent: coordinator
    depends_on: [review, security_scan]
    output: final_review
