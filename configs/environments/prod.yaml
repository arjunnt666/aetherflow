env: production
log_level: INFO

llm:
  provider: openai
  model: gpt-4o
  temperature: 0.1
  max_tokens: 4096

memory:
  backend: hybrid
  vector_store: qdrant
  embedding_model: text-embedding-3-large
  max_working_tokens: 16000
  episodic_retention_days: 90
  semantic_top_k: 12
  enable_graph: true

security:
  enable_rbac: true
  enable_sandbox: true
  enable_pii_redaction: true
  audit_log: true

observability:
  enable_tracing: true
  enable_metrics: true
  log_level: INFO
  prometheus_port: 9090

max_concurrent_agents: 64
default_timeout: 900.0
enable_self_healing: true
